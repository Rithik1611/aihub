[project]
name = "aihub-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "pyjwt==2.10.1",
    "alembic==1.14.0",
    "httpx==0.28.1",
    "python-multipart==0.0.20",  # form uploads on /chat/stream and /chat/send-with-file
    "aihub-ai",  # the agent core, ../ai (workspace member; docs/adr/0009)
]

[tool.uv.sources]
aihub-ai = { workspace = true }

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==1.14.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The agent core is checked by pyright from the repo root; here only its interface is used.
module = ["ai", "ai.*"]
follow_imports = "silent"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "ASYNC",    # async pitfalls
    "S",        # bandit security
    "SIM",      # simplify
    "RUF",
]
ignore = ["S101"]  # assert is how tests assert

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # test fixtures carry obvious fake secrets
"alembic/*" = ["E501"]
"scripts/*" = ["E402", "S105"]  # path bootstrap before import; PASS is an outcome, not a secret

[[tool.mypy.overrides]]
# Used by the verification scripts to read cableCORE's own data; no stubs published.
module = ["asyncpg"]
ignore_missing_imports = true
